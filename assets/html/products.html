<!DOCTYPE html>
<html>

<head>
    <title>Produtos</title>
    <link rel="stylesheet" href="./../css/bootstrap5.0.2.min.css">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col text-end mt-3">
                <h1>Produtos</h1>
            </div>
            <div class="col text-start mt-3">
                <button id="toggleButton" class="btn btn-primary" onclick="toggleText()">Imprimir</button>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col text-center">
                <input type="text" id="searchInput" class="form-control" placeholder="Pesquisar por nome ou cód. de barras" oninput="filterProducts()">
            </div>
        </div>        
        <div id="products-list" class="row m-3">
            <!-- Produtos serão inseridos aqui via JavaScript -->
        </div>
        <script src="./../js/bootstrap5.0.2.js"></script>
        <script>

            let print = window.api.getStore('print');
            if (!print) {
                let button = document.getElementById("toggleButton");
                button.innerHTML = "Ver Peso";
                button.classList.replace('btn-primary', 'btn-secondary');
            } else {
                let button = document.getElementById("toggleButton");
                button.innerHTML = "Imprimir";
                button.classList.replace('btn-secondary', 'btn-primary');
            }

            function toggleText() {
                let print = true;
                var button = document.getElementById("toggleButton");
                if (button.innerHTML == "Imprimir") {
                    button.innerHTML = "Ver Peso";
                    button.classList.replace('btn-primary', 'btn-secondary');
                    print = false;
                } else {
                    button.innerHTML = "Imprimir";
                    button.classList.replace('btn-secondary', 'btn-primary');
                    print = true;
                }
                window.api.send("settings-saved-Print-or-tosee", { print });
            }

            function selecionado(event, codbarras) {
                event.preventDefault();
                event.stopPropagation();

                let cards = document.querySelectorAll('.card');
                cards.forEach(card => card.classList.remove('bg-primary'));

                let idx = document.getElementById('idx' + codbarras);
                idx.classList.toggle('bg-primary');

                window.api.send("settings-saved-produto", { codbarras });
            }

            function displayProducts(produtos) {
                const productsList = document.getElementById('products-list');
                productsList.innerHTML = '';  // Limpa a lista de produtos existentes
                produtos.forEach(produto => {
                    const productCard = `
                        <div class="col-md-4" onclick="selecionado(event, ${produto.codbarras})">
                            <div class="card" id="idx${produto.codbarras}">
                                <div class="card-body">
                                    <p class="card-title m-0 p-0 fw-bold fs-4">${produto.nome}</p>
                                    <p class="card-text m-0 p-0">${produto.codbarras}</p>
                                    <p class="card-text m-0 p-0">${produto.preco}</p>
                                </div>
                            </div>
                        </div>
                    `;
                    productsList.innerHTML += productCard;
                });
            }

            async function filterProducts() {
                const searchText = document.getElementById('searchInput').value.toLowerCase();
                const produtos = await FilterErvas();
                const filteredProducts = produtos.filter(produto => {
                    return (produto.nome && produto.nome.toLowerCase().includes(searchText)) || 
                        (produto.codbarras && produto.codbarras.includes(searchText));
                });
                displayProducts(filteredProducts);
            }

            function capitalize(str) {
                if (!str || typeof str !== 'string') {
                    return '';
                }
                return str.charAt(0).toUpperCase() + str.slice(1);
            }

            async function loadProducts() {
                const api =  window.api.getStore('api');
                const response = await fetch(api);
                const data = await response.json();
                return data.result ?? [];
            }

            async function FilterErvas() {
                let data = [];
                let produtos = await loadProducts();
                console.log(produtos);
                produtos.forEach(produto => {
                    if (produto.nome.includes("granel")) {
                        data.push({
                            nome: capitalize(produto.nome),
                            codbarras: produto.cod_barras,
                            preco: produto.preco
                        });
                    }
                });
                return data;
            }

            // Chamar loadProducts quando a página carrega
            window.onload = async () => {
                const produtos = await FilterErvas()
                displayProducts(produtos);
            }
        </script>
</body>

</html>
